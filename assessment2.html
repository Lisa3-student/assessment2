<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <title>あなたに似ている動物診断</title>
</head>
<body class="bg-primary-subtle">
    <header>
      <nav class="navbar bg-primary" data-bs-theme="dark">
        <div class="container-fluid">
          <a class="navbar-brand" href="#">あなたに似ている動物診断</a>
        </div>
      </nav>
    </header>
    <div class="container pt-5">
        <h1>あなたに似ている動物は？</h1>
        <p>名前と、自分で思う性格を選んでください。</p>
        <div class="row">
            <div class="col-sm-9 col-lg-6">
                <div class="input-group mb-3">
                    <input type="text" class="form-control" id="user-name" size="40" maxlength="20" placeholder="名前を入力">
                </div>
                <fieldset class="personality-options mb-3">
                    <legend>あなたの性格は？</legend>
                    <label><input type="radio" name="personality" value="active"> 明るくて社交的</label>
                    <label><input type="radio" name="personality" value="calm"> 冷静で慎重</label>
                    <label><input type="radio" name="personality" value="curious"> 好奇心旺盛</label>
                    <label><input type="radio" name="personality" value="kind"> 優しくて思いやりがある</label>
                </fieldset>
                <button class="btn btn-primary" id="assessment" type="button">診断する</button>
            </div>
        </div>
        <div class="row">
            <div class="col-lg-9">
                <div id="result-area"></div>
            </div>
        </div>
        <div id="tweet-area" class="mt-3">
            <a href="https://x.com/intent/tweet?button_hashtag=あなたに似ている動物&ref_src=twsrc%5Etfw" class="twitter-hashtag-button"
                data-text="診断結果の文章" data-show-count="false">
                Post #あなたに似ている動物</a>
            <script async src="https://platform.x.com/widgets.js" charset="utf-8"></script>
        </div>
    </div>
    <script src="assessment.js"></script>
</body>
</html>
